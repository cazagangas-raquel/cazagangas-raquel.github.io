name: Actualizar ofertas

on:
  schedule:
    # Cada 2 horas de 7:07 a 23:07 (hora de Canarias = UTC en invierno)
    - cron: "7 7-23/2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: actualizar-ofertas
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4 lxml

      - name: Buscar y actualizar ofertas
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/update_deals.py

      - name: Guardar cambios
        run: |
          git config user.name "cazagangas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deals.json data/state.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Cazagangas: actualización automática $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main
          git push origin HEAD:main
